<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>dm</title>
<style>
  :root {
    --bg: #101418;
    --panel: #171d23;
    --line: #263039;
    --fg: #d7dee5;
    --dim: #7d8b98;
    --note: #7d8b98;
    --working: #63a9ff;
    --blocked: #ffb454;
    --done: #58d68d;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: baseline; gap: 8px;
    padding: 10px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .counts {
    margin-left: auto; font-size: 12px; color: var(--dim);
    min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  header .sheet-open, header .toggle {
    flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    background: none; border: 1px solid var(--line); color: var(--fg);
    border-radius: 6px; padding: 4px 12px; font-size: 13px;
    min-height: 44px; min-width: 44px;
  }
  header .toggle.on { border-color: var(--working); color: var(--working); }

  /* The picture grid: the active window's panes, in the arrangement the desk
     shows. A tile with no picture says so rather than staying blank. */
  body.thumbs #panes, body.thumbs #panes-head { display: none; }
  #thumbs {
    display: none;
    position: relative;
    height: 56vh;
    margin: 10px 12px 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  body.thumbs #thumbs { display: block; }
  #thumbs .tile { position: absolute; padding: 2px; }
  #thumbs .frame {
    position: relative; width: 100%; height: 100%;
    border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
    background: var(--bg);
  }
  #thumbs .label {
    position: absolute; left: 0; top: 0; z-index: 1;
    padding: 1px 4px; font-size: 10px; line-height: 1.3;
    color: var(--fg); background: var(--panel);
    border-bottom-right-radius: 4px;
    max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  #thumbs canvas { display: block; width: 100%; height: 100%; }
  #thumbs .tile.gone .label::after { content: "  no picture"; color: var(--dim); }
  #banner {
    display: none;
    margin: 10px 12px 0; padding: 8px 10px;
    border: 1px solid var(--error); color: var(--error);
    border-radius: 6px; font-size: 13px;
  }
  #banner.show { display: block; }
  h2 {
    margin: 18px 12px 6px;
    font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--dim);
  }
  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 10px;
    padding: 9px 12px;
    border-top: 1px solid var(--line);
    text-decoration: none; color: inherit;
  }
  .row:active { background: var(--panel); }
  .row .id { font: 13px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); }
  .row .title { font-weight: 600; }
  .row .title .kind { font-weight: 400; color: var(--dim); font-size: 12px; }
  .row .msg { grid-column: 1 / -1; font-size: 13px; color: var(--dim); }
  .row .where { grid-column: 1 / -1; font-size: 11px; color: var(--dim); }
  .row .where b { color: #9fb0bf; font-weight: 500; }
  .state { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .state.note { color: var(--note); }
  .state.working { color: var(--working); }
  .state.blocked { color: var(--blocked); }
  .state.done { color: var(--done); }
  .state.error { color: var(--error); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.working { background: var(--working); }
  .dot.blocked { background: var(--blocked); }
  .dot.done { background: var(--done); }
  .dot.error { background: var(--error); }
  .dot.note { background: var(--note); }
  .empty { padding: 12px; color: var(--dim); font-size: 13px; }

  /* The box compose sits under the box: a blocked lane answered without the
     pane's pty. */
  #compose {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px;
    padding: 10px 12px;
    border-top: 1px solid var(--line);
  }
  #compose input, #compose select {
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 9px 10px; font-size: 15px; min-width: 0; min-height: 44px;
  }
  #compose #compose-msg, #compose button { grid-column: 1 / -1; }
  #compose button {
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; font-size: 14px; min-height: 44px;
  }

  /* The actions sheet: full height, one thumb wide, dismissed by a tap on the
     page behind it or by the back gesture. */
  #sheet {
    position: fixed; inset: 0; z-index: 6;
    display: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #sheet.open { display: flex; justify-content: flex-end; }
  #sheet .panel {
    width: calc(100% - 56px); max-width: 380px; height: 100%;
    display: flex; flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow: hidden;
  }
  #sheet .panel > header { position: static; }
  #sheet .close {
    margin-left: auto; background: none; border: 1px solid var(--line);
    color: var(--fg); border-radius: 6px; padding: 4px 12px; font-size: 13px;
    min-height: 44px; min-width: 44px;
  }
  #sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #sheet-body h2 { margin: 16px 12px 6px; }
  .targets {
    display: flex; align-items: center; gap: 8px;
    padding: 2px 12px 8px; font-size: 12px; color: var(--dim);
  }
  .targets select {
    flex: 1; min-width: 0;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 8px; font-size: 13px;
  }
  .cmd { border-top: 1px solid var(--line); }
  .cmd > button, .cmd .cmd-label {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; color: var(--fg);
    font: inherit; font-size: 16px;
    padding: 15px 12px; min-height: 52px;
  }
  .cmd .cmd-label { color: var(--dim); padding-bottom: 4px; min-height: 0; }
  .cmd > button:active { background: var(--bg); }
  .cmd > button.armed { color: var(--error); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 12px 12px; }
  .chips button {
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 9px 12px; font-size: 14px; min-height: 44px; min-width: 44px;
  }
  .chips button:active { border-color: var(--working); color: var(--working); }

  /* The terminal takes the whole screen once a pane is opened. */
  #pane {
    position: fixed; inset: 0; z-index: 5;
    display: none; flex-direction: column;
    background: var(--bg);
  }
  #pane.open { display: flex; }
  #pane header { position: static; }
  #pane .close {
    margin-left: auto; background: none; border: 1px solid var(--line);
    color: var(--fg); border-radius: 6px; padding: 4px 12px; font-size: 13px;
    min-height: 44px; min-width: 44px;
  }
  /* The pane's own commands: one row, scrolled sideways at 320 points. */
  #pane-actions {
    display: flex; gap: 6px;
    padding: 6px 8px;
    overflow-x: auto;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  #pane-actions button {
    flex: none;
    display: inline-flex; align-items: center;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 12px; font-size: 13px; min-height: 44px; min-width: 44px;
  }
  #pane-actions button.armed { border-color: var(--error); color: var(--error); }
  /* The strip names where the session stands and walks it. */
  #strip {
    display: flex; gap: 10px;
    padding: 6px 8px;
    overflow-x: auto;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  #strip .grp { display: flex; align-items: center; gap: 4px; flex: none; }
  #strip .name { font-size: 12px; color: var(--dim); white-space: nowrap; }
  #strip .name b { color: var(--fg); font-weight: 600; }
  #strip button {
    background: none; border: 1px solid var(--line); color: var(--fg);
    border-radius: 6px; min-width: 44px; height: 44px; font-size: 15px;
  }
  #text {
    flex: 1; min-height: 0;
    margin: 0;
    padding: 8px 10px;
    overflow: auto;
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  #send {
    display: flex; gap: 6px; padding: 8px;
    border-top: 1px solid var(--line); background: var(--panel);
  }
  #send input {
    flex: 1; min-width: 0;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 9px 10px; font-size: 15px; min-height: 44px;
  }
  #send button {
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 9px 12px; font-size: 14px; min-height: 44px; min-width: 44px;
  }
  #send button.enter { border-color: var(--working); color: var(--working); }
</style>
</head>
<body>
  <header>
    <h1 id="session">dm</h1>
    <span class="counts" id="counts"></span>
    <button id="sheet-open" class="sheet-open">actions</button>
    <button id="thumbs-toggle" class="toggle">pictures</button>
  </header>
  <div id="banner"></div>

  <div id="thumbs"><div class="empty">loading</div></div>
  <h2 id="panes-head">panes</h2>
  <div id="panes"><div class="empty">loading</div></div>

  <h2>box</h2>
  <div id="box"><div class="empty">loading</div></div>
  <form id="compose">
    <input id="compose-key" type="text" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" placeholder="key">
    <select id="compose-state">
      <option value="note">note</option>
      <option value="working">working</option>
      <option value="blocked">blocked</option>
      <option value="done">done</option>
      <option value="error">error</option>
    </select>
    <input id="compose-msg" type="text" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" placeholder="message">
    <button id="compose-post">post to the box</button>
  </form>

  <div id="sheet">
    <div class="panel">
      <header>
        <h1>actions</h1>
        <button class="close" id="sheet-close">close</button>
      </header>
      <div id="sheet-body"><div class="empty">loading</div></div>
    </div>
  </div>

  <section id="pane">
    <header>
      <h1 id="pane-title">pane</h1>
      <span class="state" id="pane-state"></span>
      <button class="close" id="pane-close">close</button>
    </header>
    <div id="pane-actions"></div>
    <div id="strip">
      <span class="grp">
        <button id="win-prev" title="previous window">‹</button>
        <span class="name" id="strip-window"></span>
        <button id="win-next" title="next window">›</button>
      </span>
      <span class="grp">
        <button id="ws-prev" title="previous workspace">‹</button>
        <span class="name" id="strip-workspace"></span>
        <button id="ws-next" title="next workspace">›</button>
      </span>
    </div>
    <pre id="text"></pre>
    <div id="send">
      <input id="send-text" type="text" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" placeholder="type into the pane">
      <button id="send-plain">send</button>
      <button id="send-enter" class="enter">enter</button>
    </div>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>

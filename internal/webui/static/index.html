<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>dm</title>
<style>
  :root {
    --bg: #101418;
    --panel: #171d23;
    --line: #263039;
    --fg: #d7dee5;
    --dim: #7d8b98;
    --note: #7d8b98;
    --working: #63a9ff;
    --blocked: #ffb454;
    --done: #58d68d;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: baseline; gap: 8px;
    padding: 10px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .counts { margin-left: auto; font-size: 12px; color: var(--dim); }
  #banner {
    display: none;
    margin: 10px 12px 0; padding: 8px 10px;
    border: 1px solid var(--error); color: var(--error);
    border-radius: 6px; font-size: 13px;
  }
  #banner.show { display: block; }
  h2 {
    margin: 18px 12px 6px;
    font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--dim);
  }
  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 10px;
    padding: 9px 12px;
    border-top: 1px solid var(--line);
    text-decoration: none; color: inherit;
  }
  .row:active { background: var(--panel); }
  .row .id { font: 13px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); }
  .row .title { font-weight: 600; }
  .row .title .kind { font-weight: 400; color: var(--dim); font-size: 12px; }
  .row .msg { grid-column: 1 / -1; font-size: 13px; color: var(--dim); }
  .row .where { grid-column: 1 / -1; font-size: 11px; color: var(--dim); }
  .row .where b { color: #9fb0bf; font-weight: 500; }
  .state { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .state.note { color: var(--note); }
  .state.working { color: var(--working); }
  .state.blocked { color: var(--blocked); }
  .state.done { color: var(--done); }
  .state.error { color: var(--error); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.working { background: var(--working); }
  .dot.blocked { background: var(--blocked); }
  .dot.done { background: var(--done); }
  .dot.error { background: var(--error); }
  .dot.note { background: var(--note); }
  .empty { padding: 12px; color: var(--dim); font-size: 13px; }

  /* The terminal takes the whole screen once a pane is opened. */
  #pane {
    position: fixed; inset: 0; z-index: 5;
    display: none; flex-direction: column;
    background: var(--bg);
  }
  #pane.open { display: flex; }
  #pane header { position: static; }
  #pane .close {
    margin-left: auto; background: none; border: 1px solid var(--line);
    color: var(--fg); border-radius: 6px; padding: 4px 10px; font-size: 13px;
  }
  #text {
    flex: 1; min-height: 0;
    margin: 0;
    padding: 8px 10px;
    overflow: auto;
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  #send {
    display: flex; gap: 6px; padding: 8px;
    border-top: 1px solid var(--line); background: var(--panel);
  }
  #send input {
    flex: 1; min-width: 0;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 9px 10px; font-size: 15px;
  }
  #send button {
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 9px 12px; font-size: 14px;
  }
  #send button.enter { border-color: var(--working); color: var(--working); }
</style>
</head>
<body>
  <header>
    <h1 id="session">dm</h1>
    <span class="counts" id="counts"></span>
  </header>
  <div id="banner"></div>

  <h2>panes</h2>
  <div id="panes"><div class="empty">loading</div></div>

  <h2>box</h2>
  <div id="box"><div class="empty">loading</div></div>

  <section id="pane">
    <header>
      <h1 id="pane-title">pane</h1>
      <span class="state" id="pane-state"></span>
      <button class="close" id="pane-close">close</button>
    </header>
    <pre id="text"></pre>
    <div id="send">
      <input id="send-text" type="text" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" placeholder="type into the pane">
      <button id="send-plain">send</button>
      <button id="send-enter" class="enter">enter</button>
    </div>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>

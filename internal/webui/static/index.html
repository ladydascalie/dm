<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101418">
<!-- A phone installs the page from here, and iOS grants push only to the app
     the home screen opens. The status bar is opaque, so the page starts below
     it and its viewport ends at the bottom of the phone. A translucent bar
     leaves the installed app a viewport one status bar shorter than the screen
     and no way to paint the strip it gives up: the composer floated above the
     home indicator with dead screen under it. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>dm</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link id="icon" rel="icon" href="data:,">
<style>
  :root {
    --bg: #101418;
    --panel: #171d23;
    --line: #263039;
    --fg: #d7dee5;
    --dim: #7d8b98;
    --note: #7d8b98;
    --working: #63a9ff;
    --blocked: #ffb454;
    --done: #58d68d;
    --error: #ff6b6b;
    /* The rail's six project accents, in slot order, so a project keeps the hue
       the desk gave it. */
    --accent-0: #bb9af7;
    --accent-1: #6edceb;
    --accent-2: #f08cd7;
    --accent-3: #7ea9ff;
    --accent-4: #f0a05a;
    --accent-5: #8cd79b;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --accent: #7ac0eb;
    --hard: #070a0d;
    --focus: #1b2530;
  }
  .a0 { --acc: var(--accent-0); }
  .a1 { --acc: var(--accent-1); }
  .a2 { --acc: var(--accent-2); }
  .a3 { --acc: var(--accent-3); }
  .a4 { --acc: var(--accent-4); }
  .a5 { --acc: var(--accent-5); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.5 var(--mono);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button, input, select, textarea { font-family: var(--mono); }
  /* The header and the tabs stay together at the top: the tab is the one
     control a thumb reaches for, so it never scrolls away. */
  .topbar { position: sticky; top: 0; z-index: 2; }
  header {
    display: flex; align-items: baseline; gap: 8px;
    padding: .5lh 1ch;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  /* The session name never wraps: a second line in the header would eat the
     screen the tabs just bought. */
  header h1 {
    flex: none; font-size: 13px; margin: 0; font-weight: 700;
    white-space: nowrap;
  }
  header h1::before { content: "["; color: var(--dim); }
  header h1::after { content: "]"; color: var(--dim); }
  /* The fleet header carries the tab's summary on a line of its own: one row
     of title and buttons leaves the counts too narrow to read at 320. */
  header.fleet { display: block; }
  header.fleet .bar { display: flex; align-items: center; gap: 8px; }
  header.fleet h1 {
    flex: 0 1 auto; min-width: 0; margin-right: auto;
    overflow: hidden; text-overflow: ellipsis;
  }
  header.fleet .counts {
    margin-top: 4px; font-size: 11px; color: var(--dim);
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  header .sheet-open, header .toggle {
    flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    background: none; border: 1px solid var(--line); color: var(--fg);
    padding: 0 1ch; font-size: 11px;
    min-height: 36px; min-width: 44px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  header .toggle.on { border-color: var(--working); color: var(--working); }
  /* A device that cannot push says so on the switch itself: dashed and dim,
     where the plain off state is solid. */
  header .toggle[data-state="denied"],
  header .toggle[data-state="unsupported"] { color: var(--dim); border-style: dashed; }

  /* Two views, one tab each. The tab is a link, so the address bar carries it
     and the back gesture walks the views the reader visited. */
  nav.tabs {
    display: flex;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  nav.tabs a {
    flex: 1 1 0;
    display: flex; align-items: center; justify-content: center;
    min-height: 44px; min-width: 44px;
    font-size: 11px; font-weight: 600;
    color: var(--dim); text-decoration: none;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  nav.tabs a[aria-selected="true"] {
    color: var(--accent);
    box-shadow: inset 0 2px 0 0 var(--accent);
  }
  body.tab-panes #view-box, body.tab-box #view-panes { display: none; }

  /* The needs-you strip rides in the sticky top bar: a pane that is blocked or
     in error is never below a fold, and a sideways swipe walks the cards. One
     card is one tap target that opens its pane. */
  #needs {
    display: none;
    gap: 8px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  #needs.show { display: flex; }
  #needs::-webkit-scrollbar { display: none; }
  #needs .card {
    position: relative; flex: 0 0 auto;
    width: min(84%, 320px);
    display: block;
    padding: 8px 10px 8px 14px;
    background: var(--bg);
    border: 1px solid var(--line);
    min-height: 44px;
    text-decoration: none; color: inherit;
    overflow: hidden;
    box-shadow: inset 3px 0 0 0 var(--accent);
  }
  /* The project's accent stands on the card's edge, so a card names the
     section it came from. */
  #needs .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--acc);
  }
  #needs .card.blocked { border-color: var(--blocked); }
  #needs .card.error { border-color: var(--error); }
  #needs .card:active { background: var(--panel); }
  #needs .chead { display: flex; align-items: baseline; gap: 6px; }
  #needs .cname {
    flex: 0 1 auto; min-width: 0;
    font-size: 12px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #needs .cplace {
    flex: 1 1 auto; min-width: 0;
    font-size: 11px; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #needs .cwant {
    flex: none; font-size: 10.5px;
    text-transform: uppercase; letter-spacing: .06em;
  }
  #needs .ago { flex: none; font-size: 10px; color: var(--dim); }
  /* The message is the reason the card exists, so it keeps two lines and no
     more: a third line would push the next card out of the strip. */
  #needs .cmsg {
    margin-top: 2px;
    font-size: 12px; line-height: 1.35; color: var(--fg);
    overflow-wrap: anywhere;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden;
  }

  /* One section per project: its accent mark, its name, the count of what it
     holds, then its rows. The rail's order decides the sections' order. */
  .project { border-top: 1px solid var(--line); }
  .project h2.proj {
    display: flex; align-items: center; gap: 8px;
    margin: 14px 12px 2px;
    font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
  }
  .project .mark {
    flex: none; width: 4px; height: 12px;
    background: var(--acc);
  }
  .project .pname {
    flex: 0 1 auto; min-width: 0;
    font-size: 13px; font-weight: 600; color: var(--fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .project .pcount {
    flex: 0 1 auto; margin-left: auto; min-width: 0;
    font-size: 11px; font-weight: 400; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* The shelf is the panes set aside: its heading carries the count, and it
     starts folded, so the live fleet is what a thumb sees first. */
  .shelf { border-top: 1px solid var(--line); margin-top: 14px; }
  .shelf .fold { border-top: 0; }
  .shelf .fold > span:first-of-type { font-weight: 600; color: var(--fg); }
  .shelf .scount { margin-left: auto; color: var(--dim); }
  /* A shelved row keeps a mark of its own, so it can never read as a pane the
     desk is drawing. */
  .shelved { background: linear-gradient(to right, var(--panel) 3px, transparent 3px); }
  .row .where .mark-shelved {
    text-transform: uppercase; letter-spacing: .06em; color: var(--blocked);
  }
  /* The shell panes fold to one count line: a pane with no agent has no status
     to paint and no work to report, so it keeps the way in without a row each. */
  .fold {
    display: flex; align-items: center; gap: 6px;
    width: 100%; min-height: 44px;
    padding: 8px 12px;
    background: none; border: 0; border-top: 1px solid var(--line);
    color: var(--dim); font: inherit; font-size: 12px; text-align: left;
  }
  .fold:active { background: var(--panel); }
  .fold .caret { flex: none; font-size: 10px; }

  /* The picture grid: the active window's panes, in the arrangement the desk
     shows. A tile with no picture says so rather than staying blank. */
  /* The grid stands in for the pane list only when its tiles are thumb sized.
     A dense grid is a picture, so the list below it stays the way in. */
  body.thumbs.grid-live #panes { display: none; }
  #thumbs {
    display: none;
    position: relative;
    height: 56vh;
    margin: 10px 12px 0;
    border: 1px solid var(--line);
    overflow: hidden;
  }
  body.thumbs #thumbs { display: block; }
  #thumbs .tile { position: absolute; padding: 2px; }
  #thumbs .tile:not([href]) { cursor: default; }
  #thumbs .frame {
    position: relative; width: 100%; height: 100%;
    border: 1px solid var(--line); overflow: hidden;
    background: var(--bg);
  }
  #thumbs .label {
    position: absolute; left: 0; top: 0; z-index: 1;
    padding: 1px 4px; font-size: 10px; line-height: 1.3;
    color: var(--fg); background: var(--panel);
    max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  #thumbs canvas { display: block; width: 100%; height: 100%; }
  #thumbs .tile.gone .label::after { content: "  no picture"; color: var(--dim); }
  #banner {
    display: none;
    margin: 10px 12px 0; padding: 8px 10px;
    border: 1px solid var(--error); color: var(--error);
    font-size: 13px;
  }
  #banner.show { display: block; }
  h2 {
    margin: 18px 12px 6px;
    font-size: 11px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--dim);
  }
  /* A row is one tap target: the name and its state on the first line, the
     facts that place it on the second. */
  .row {
    display: block;
    min-height: 44px;
    padding: 9px 12px;
    border-top: 1px solid var(--line);
    text-decoration: none; color: inherit;
  }
  .row:active { background: var(--panel); }
  .row .title { display: flex; align-items: baseline; gap: 10px; }
  .row .title .name {
    flex: 1 1 auto; min-width: 0;
    font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row .title .state { flex: none; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;}
  .row .id { font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); }
  /* A message can carry a path with no break in it: break it inside the row,
     whatever the width. The row is one tap target, so nothing in it may widen
     the document and shrink the page. */
  .row .msg { font-size: 13px; color: var(--dim); overflow-wrap: anywhere; }
  /* The facts are chips: a gap says where one ends, so no separator can end a
     line, and a fact that wraps is still a fact of this row. A chip never
     shrinks, so a long line wraps instead of cutting a fact short. */
  .row .where {
    display: flex; flex-wrap: wrap; gap: 2px 10px;
    margin-top: 1px;
    font-size: 11px; line-height: 1.45; color: var(--dim);
  }
  .row .where > * {
    flex: 0 0 auto; max-width: 100%; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .where b { color: #9fb0bf; font-weight: 500; }
  /* A folder has no end worth trimming: keep its tail, which is the part that
     names the work, and let the head go. The box clips from the left, so the
     ellipsis lands there; the bdi keeps the path itself in reading order. */
  .row .where .cwd {
    max-width: 100%;
    direction: rtl; text-align: left;
  }
  .row .where .cwd bdi { direction: ltr; unicode-bidi: isolate; }
  .state { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
  .state.note { color: var(--note); }
  .state.working { color: var(--working); }
  .state.blocked { color: var(--blocked); }
  .state.done { color: var(--done); }
  .state.error { color: var(--error); }
  .dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; }
  .dot.working { background: var(--working); }
  .dot.blocked { background: var(--blocked); }
  .dot.done { background: var(--done); }
  .dot.error { background: var(--error); }
  .dot.note { background: var(--note); }
  .empty { padding: 12px; color: var(--dim); font-size: 13px; }

  /* The box compose sits under the box: a blocked lane answered without the
     pane's pty. */
  #compose {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px;
    padding: 10px 12px;
    border-top: 1px solid var(--line);
  }
  #compose input, #compose select {
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line);
    padding: 9px 10px; font-size: 15px; min-width: 0; min-height: 40px;
  }
  #compose #compose-msg, #compose button { grid-column: 1 / -1; }
  #compose button {
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line);
    padding: 10px 12px; font-size: 14px; min-height: 40px;
  }

  /* The actions sheet: full height, one thumb wide, dismissed by a tap on the
     page behind it or by the back gesture. */
  #sheet {
    position: fixed; inset: 0; z-index: 6;
    display: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #sheet.open { display: flex; justify-content: flex-end; }
  #sheet .panel {
    width: calc(100% - 56px); max-width: 380px; height: 100%;
    display: flex; flex-direction: column;
    background: var(--panel);
    overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: 4px 4px 0 0 var(--hard);
  }
  #sheet .panel > header { position: static; }
  #sheet .panel > header h1 {
    text-transform: uppercase; font-size: 11px; letter-spacing: .08em;
  }
  #sheet .close {
    margin-left: auto; background: none; border: 1px solid var(--line);
    color: var(--fg); padding: 4px 12px; font-size: 13px;
    min-height: 44px; min-width: 44px;
  }
  #sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #sheet-body h2 { margin: 16px 12px 6px; text-transform: uppercase; font-size: 11px; letter-spacing: .08em;}
  .targets {
    display: flex; align-items: center; gap: 8px;
    padding: 2px 12px 8px; font-size: 12px; color: var(--dim);
  }
  .targets select {
    flex: 1; min-width: 0;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line);
    padding: 7px 8px; font-size: 13px; min-height: 44px;
  }
  .cmd { border-top: 1px solid var(--line); }
  .cmd > button, .cmd .cmd-label {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; color: var(--fg);
    font: inherit; font-size: 16px;
    padding: 15px 12px; min-height: 52px;
  }
  .cmd > button { min-height: 44px; text-transform: uppercase; font-size: 11px; letter-spacing: .06em; }
  .cmd .cmd-label { color: var(--dim); padding-bottom: 4px; min-height: 0; }
  .cmd > button:active { background: var(--bg); }
  .cmd > button.armed { color: var(--error); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 12px 12px; }
  .chips button {
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line);
    padding: 9px 12px; font-size: 11px; min-height: 40px; min-width: 44px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .chips button:active { border-color: var(--working); color: var(--working); }

  /* The terminal takes the whole screen once a pane is opened. The height comes
     from the dynamic viewport, so a browser's own bottom bar cannot sit over
     the input row, and the safe area insets stay what the page already
     respects. */
  #pane {
    position: fixed; inset: 0; z-index: 5;
    height: 100vh;
    height: 100dvh;
    display: none; flex-direction: column;
    background: var(--bg);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #pane.open { display: flex; }
  #pane header { position: static; }
  /* A long status message once pushed the close button off the screen. Every
     part of the header now has its own rule: the title shrinks and ellipsises,
     the state line takes the room that is left, and the button never shrinks. */
  #pane header h1 {
    flex: 0 1 auto; min-width: 0; max-width: 50%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #pane header h1::before { content: "["; color: var(--dim); }
  #pane header h1::after { content: "]"; color: var(--dim); }
  /* The word never shrinks, so a clipped line still names the state and still
     says a message is there; the message takes what room is left of the line. */
  #pane header #pane-state {
    flex: 1 1 0; min-width: 0;
    display: flex; align-items: baseline;
    overflow: hidden; white-space: nowrap;
    text-transform: uppercase;
    font-size: 10.5px;
    letter-spacing: .06em;
  }
  #pane-state-word { flex: none; font-weight: inherit; }
  #pane-state-msg {
    min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #pane .close {
    flex: none;
    margin-left: auto; background: none; border: 1px solid var(--line);
    color: var(--fg); padding: 4px 12px; font-size: 11px;
    min-height: 36px; min-width: 44px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  /* The stop control appears only while the pane is busy. A phone has no
     Escape, and a run nobody can interrupt owns the desk until someone finds a
     keyboard. */
  #pane .stop {
    display: none; flex: none;
    background: none; border: 1px solid var(--line);
    color: var(--error); padding: 4px 10px; font-size: 11px;
    min-height: 36px; min-width: 44px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  #pane .stop.show {
    display: inline-flex; align-items: center; justify-content: center;
  }
  /* Three rows of controls sit above the text, and on a phone that is still
     most of the pane. The chevron folds them onto the title row, and the
     device keeps the answer, so a reader who wants the text gets it on the
     next visit too. */
  #pane .collapse {
    flex: none;
    background: none; border: 1px solid var(--line);
    color: var(--fg); padding: 4px 10px; font-size: 11px;
    line-height: 1; min-height: 36px; min-width: 44px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  /* Folded, the bar takes no room at all. The switch and the note carry their
     own display rules, so each one is named here to win over them. */
  #pane.collapsed #views,
  #pane.collapsed #pane-actions,
  #pane.collapsed #pane-note { display: none; }
  /* The view switch: transcript, activity, screen, one tap apart. It is absent
     for a pane whose session cannot be read, because the screen is then the
     only honest view. */
  #views {
    display: none;
    padding: 6px 8px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  #views.show { display: block; }
  #views .seg {
    display: flex; overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--line);
  }
  #views .seg a {
    flex: 1 1 0; min-height: 44px; min-width: 44px;
    display: flex; align-items: center; justify-content: center;
    border-left: 1px solid var(--line);
    font-size: 11px; letter-spacing: .06em;
    color: var(--dim); text-decoration: none;
    text-transform: uppercase;
  }
  #views .seg a:first-child { border-left: 0; }
  /* The chosen view is the one filled cell, so its label goes dark on the fill:
     a blue label on the blue fill is a label a thumb has to hunt for. */
  #views .seg a[aria-selected="true"] {
    background: var(--working); color: #0b1013; font-weight: 650;
  }
  /* The one line that says why the screen is showing instead of the session. */
  #pane-note {
    display: none;
    padding: 8px 12px;
    font-size: 12px; color: var(--dim);
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  #pane-note.show { display: block; }
  /* The pane's own commands: one row of three, so they all read at 320 points
     with no sideways scrolling. The cells keep the order the list is built in. */
  #pane-actions {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px;
    padding: 6px 8px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  #pane-actions button {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line);
    padding: 8px 4px; font-size: 11px; min-height: 44px;
    min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  #pane-actions button.armed { border-color: var(--error); color: var(--error); }
  /* The screen holds the text and the one control that floats over it. */
  #screen { position: relative; display: flex; flex: 1; min-height: 0; }
  #latest {
    position: absolute; right: 10px; bottom: 10px;
    display: none; align-items: center; justify-content: center;
    min-height: 44px; min-width: 44px;
    padding: 0 12px; font-size: 11px;
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line);
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  #latest.show { display: inline-flex; }
  /* One of the three views is on screen at a time, and each one scrolls on its
     own, so the follow rule reads the box the reader is actually in. */
  #screen > .view {
    display: none;
    flex: 1 1 auto; min-width: 0; min-height: 0;
    overflow: auto; -webkit-overflow-scrolling: touch;
  }
  #screen.show-screen #text,
  #screen.show-transcript #transcript,
  #screen.show-activity #activity { display: block; }
  #text {
    margin: 0;
    padding: 8px 10px;
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  /* The transcript: a turn's ask in a quoted block, its steps in order, the
     unfinished step as a live row, and the turn's own numbers at its foot. */
  #transcript .body { padding: 12px 12px 18px; }
  .turn-hd {
    display: flex; align-items: baseline; gap: 8px;
    margin: 2px 0 8px;
    font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--dim);
  }
  .turn-hd b { color: var(--fg); font-weight: 650; }
  .turn-hd .tnum { margin-left: auto; }
  .you {
    border-left: 2px solid var(--accent-0);
    background: #171a24;
    padding: 9px 11px;
    margin: 0 0 12px;
    font-size: 14px; color: #cfd8e0;
    overflow-wrap: anywhere;
  }
  .say {
    margin: 0 0 12px;
    font-size: 14.5px; line-height: 1.55; color: #cfd8e0;
    overflow-wrap: anywhere;
  }
  /* Agent prose arrives as HTML the daemon rendered, so the transcript styles
     what a conversation holds: headings, lists, quotes, tables and code fences.
     A block keeps the reader's font size, because a phone reads in one column. */
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 10px; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
    margin: 14px 0 6px; line-height: 1.3; font-weight: 650; color: var(--fg);
  }
  .md h1 { font-size: 17px; }
  .md h2 { font-size: 16px; }
  .md h3 { font-size: 15px; }
  .md h4, .md h5, .md h6 { font-size: 14px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 20px; }
  .md li { margin: 3px 0; }
  .md li > p { margin: 0 0 6px; }
  .md blockquote {
    margin: 0 0 10px; padding: 2px 0 2px 10px;
    border-left: 2px solid var(--line); color: var(--dim);
  }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .md a { color: var(--working); text-underline-offset: 2px; }
  .md code {
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #0c1013; border: 1px solid var(--line);
    padding: 1px 4px; overflow-wrap: anywhere;
  }
  .md pre {
    margin: 0 0 10px; padding: 8px 10px;
    background: #0c1013; border: 1px solid var(--line);
    overflow-x: auto;
  }
  .md pre code { background: none; border: 0; padding: 0; font-size: 12px; }
  /* A table that does not fit scrolls inside its own box, so the transcript
     never scrolls sideways with it. The box is the page's, not the table: a
     table told to be a block loses the column widths its cells asked for. */
  .tablewrap { margin: 0 0 10px; overflow-x: auto; }
  .md table { border-collapse: collapse; font-size: 13px; }
  /* The prose wraps anywhere so a long path cannot push the page sideways, and
     a cell must not inherit that: a one-word column would collapse to one
     letter per line. */
  .md th, .md td {
    border: 1px solid var(--line); padding: 5px 8px;
    text-align: left; vertical-align: top;
    overflow-wrap: normal;
  }
  .md th { background: #171a24; font-weight: 600; color: var(--fg); }
  .md img { max-width: 100%; height: auto; }
  /* A thought is one row until a tap: the words are often long, and a reader
     usually wants the answer rather than the reasoning that found it. */
  .thinkrow {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 8px 0;
    background: none; border: 0; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--dim); text-align: left;
  }
  button.thinkrow { min-height: 44px; }
  .thinkrow .chev { font-size: 10px; transition: transform .12s; }
  .think.open .thinkrow .chev { transform: rotate(90deg); }
  .thinkrow b { font-weight: 500; }
  .think.open .thinkrow b { color: var(--fg); }
  .thinkrow .dia { margin-left: auto; }
  .thinktext {
    padding: 0 0 10px 18px;
    font-size: 13.5px; color: var(--dim);
  }
  .thinktext .more { margin-top: 4px; font-size: 11.5px; opacity: .8; }
  /* A step that carries output is one tap target, so it keeps the 44 it needs
     even when its own line is shorter. */
  .step {
    display: grid; grid-template-columns: 18px minmax(0, 1fr) auto;
    gap: 1px 9px; align-items: baseline;
    width: 100%; padding: 7px 0;
    background: none; border: 0; border-top: 1px solid var(--line);
    color: inherit; font: inherit; text-align: left;
  }
  button.step { min-height: 44px; align-content: center; }
  .step .ic { font-size: 12px; color: var(--dim); text-align: center; }
  .step .t {
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #a9b8c6;
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .step .t b { color: var(--accent-1); font-weight: 500; }
  .step .dur { font-size: 11px; color: var(--dim); white-space: nowrap; }
  /* What the call was told, above what it answered: both are bodies the reader
     asked for by tapping, so they share one shape. */
  /* The arguments stay shut until the tap: a write tool's arguments can be a
     whole file, and a folded row must stay one row. */
  .step .args {
    display: none;
    grid-column: 2 / -1; margin: 4px 0 2px; padding: 6px 8px;
    font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #a9b8c6;
    background: #0c1013; border: 1px solid var(--line);
    white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 116px; overflow: hidden;
  }
  .step .args .more { color: var(--dim); opacity: .8; }
  .step .out {
    grid-column: 2 / -1; margin: 4px 0 2px;
    font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dim);
    background: #0c1013; border: 1px solid var(--line);
    white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 116px; overflow: hidden;
  }
  .step .out .more { color: var(--dim); opacity: .8; }
  .step.bad .t { color: #e5b3ae; }
  .step.bad .ic, .step.bad .dur { color: var(--error); }
  .step.bad .out { border-color: #43292c; color: #d8a7a2; }
  .step.open .args { display: block; }
  .step.open .out { max-height: none; }
  .live {
    display: flex; align-items: baseline; gap: 9px;
    padding: 10px 0 2px;
    border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--working);
  }
  .live b { font-weight: 650; }
  .live .when { margin-left: auto; font-size: 11px; color: var(--dim); }
  .spin {
    width: 13px; height: 13px; border-radius: 50%; flex: none;
    border: 2px solid rgba(99,169,255,.25); border-top-color: var(--working);
    animation: sp 1s linear infinite;
    align-self: center;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
  .turnft {
    display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline;
    margin: 10px 0 22px; padding-top: 9px;
    border-top: 1px solid var(--line);
    font-size: 11px; color: var(--dim);
  }
  .turnft b { color: var(--fg); font-weight: 500; }
  .turnft .bad { color: var(--error); }

  /* The activity: the same steps, one row each, newest first, with a divider
     where a new turn starts. No prose, so the page answers "is it stuck". */
  .act {
    display: grid; grid-template-columns: 16px minmax(0, 1fr) auto;
    gap: 2px 10px; align-items: baseline;
    padding: 9px 12px;
    border-top: 1px solid var(--line);
  }
  .act .ic { font-size: 12px; color: var(--dim); text-align: center; }
  .act .t {
    font-size: 13px; color: #b9c6d2;
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .act .t b { color: var(--accent-1); font-weight: 500; }
  .act .dur { font-size: 11px; color: var(--dim); white-space: nowrap; }
  .act .sub {
    grid-column: 2 / -1;
    font-size: 11.5px; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .act.fail .ic, .act.fail .dur { color: var(--error); }
  .act.now .ic, .act.now .dur { color: var(--working); }
  .actsplit {
    padding: 8px 12px;
    font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--dim);
    background: var(--panel);
    border-top: 1px solid var(--line);
  }
  #send {
    display: flex; gap: 6px; padding: 8px; align-items: flex-end;
    border-top: 1px solid var(--line); background: var(--panel);
  }
  /* The composer is a textarea because a phone types multi-line blocks: enter
     inserts a newline, and the send control decides what leaves. It grows with
     its text, one row at rest so the row keeps the height it always had, then a
     row at a time up to 30vh, then it scrolls inside itself. resize stays off:
     a phone has no drag handle, and the text owns the height. */
  #send textarea {
    flex: 1; min-width: 0;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line);
    padding: 9px 10px; font-family: inherit; font-size: 15px; line-height: 21px;
    min-height: 44px; max-height: 30vh;
    resize: none; overflow-y: hidden;
  }
  /* The two buttons carry a glyph instead of a word, so the input takes the
     width the words gave up. The glyph is decorative: the label and the title
     are what a screen reader and a long press read. */
  #send button {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line);
    padding: 0; min-height: 44px; min-width: 44px;
    width: 44px;
  }
  /* The two glyphs do not fill their grid equally: a paper plane reaches the
     viewBox edges, a camera is a wide, short rectangle inside it. Equal boxes
     therefore read as unequal icons, so each is sized to look the same weight. */
  #send button svg { display: block; width: 18px; height: 18px;}
  #send-attach svg { width: 23px; height: 23px; }
  #send-submit svg { width: 20px; height: 20px; }
  #send button.enter { border-color: var(--working); color: var(--working); }

  /* The ask form sits above the views: a pane waiting on the reader says so on
     the pane itself, and the box scrolls alone so a long question list cannot
     take the whole phone. */
  #ask {
    display: none;
    max-height: 60vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  #ask.show { display: block; }
  #ask .ask { padding: .5lh 1ch; }
  #ask .ask-hd {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--dim);
  }
  #ask .ask-hd b { color: var(--accent); font-weight: 650; }
  #ask .ask-hd .ago { margin-left: auto; }
  #ask .ask-q { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  #ask .ask-q:first-of-type { margin-top: 8px; padding-top: 0; border-top: 0; }
  #ask .ask-qh {
    font-size: 10.5px; font-weight: 650; letter-spacing: .06em;
    text-transform: uppercase; color: var(--accent);
    display: flex;
    align-items: center;
    gap: 1ch;
  }
  #ask .ask-qh::after {
    content: ""; flex: 1; height: 1px; background: #3a4a57;
  }
  #ask .ask-qt {
    margin-top: 2px; font-size: 13.5px; line-height: 1.45; color: var(--fg);
    overflow-wrap: anywhere;
  }
  #ask .ask-hint { margin-top: 3px; font-size: 11px; color: var(--dim); }
  /* An option is one tap target: the label on its first line, the description
     under it, and the preview behind its own button, which a tap on the row
     never hits. */
  #ask .ask-opt {
    display: block; width: 100%; margin-top: 0; padding: .25lh 1ch;
    background: transparent; border: 0;
    color: inherit; text-align: left; min-height: 44px;
    border-top: 1px solid var(--line);
  }
  #ask .ask-opt:active { border-color: var(--working); background: var(--focus);}
  #ask .ask-opt.picked { border-color: var(--working); background: var(--focus); box-shadow: inset 3px 0 0 0 var(--accent);}
  #ask .ask-opt.picked .ask-label { font-weight: 700; }
  #ask .ask-line { display: flex; align-items: baseline; gap: 8px; }
  #ask .ask-tick { flex: none; font-size: 0; color: var(--accent); }
  #ask .ask-tick::before { content: "[ ]"; font-size: 12.5px; }
  #ask .ask-opt[role="radio"].picked .ask-tick::before { content: "[\25cf]"; }
  #ask .ask-opt[role="checkbox"].picked .ask-tick::before { content: "[x]"; }
  #ask .ask-opt.picked .ask-tick { color: var(--working); }
  #ask .ask-label {
    flex: 1 1 auto; min-width: 0;
    font-size: 13px; font-weight: 400; overflow-wrap: anywhere;
  }
  #ask .ask-desc {
    margin-top: 1px; font-size: 12px; color: var(--dim);
    overflow-wrap: anywhere;
  }
  #ask .ask-more {
    margin-top: 5px; background: none; border: 1px solid var(--line);
    color: var(--dim); padding: 3px 8px; font-size: 11.5px;
    min-height: 30px;
  }
  #ask .ask-preview {
    margin: 6px 0 0; padding: 6px 8px;
    font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #a9b8c6; background: #0c1013;
    border: 1px solid var(--line);
    white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 160px; overflow: auto;
  }
  #ask .ask-text {
    display: block; width: 100%; margin-top: 8px;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line);
    padding: 9px 10px; font-size: 15px; min-height: 44px;
    font-family: var(--mono);
  }
  /* The note is the second field of a question, quieter than the answer above
     it: one row tall, and the line above it is the trimmed note the model will
     read, so the reader sees the exact words that ride the item. */
  #ask .ask-notebox { margin-top: 6px; }
  #ask .ask-note-shown {
    font-size: 12px; line-height: 1.4; color: var(--dim);
    overflow-wrap: anywhere;
  }
  #ask .ask-note-shown[hidden] { display: none; }
  #ask .ask-note {
    display: block; width: 100%; height: 34px; margin-top: 4px;
    background: var(--bg); color: var(--fg);
    border: 1px dashed var(--line);
    padding: 6px 9px; font-size: 16px;
    min-height: 44px;
    font-family: var(--mono);
  }
  #ask .ask-note:focus { border-style: solid; border-color: var(--working); }
  #ask .ask-err {
    margin-top: 10px; padding: 6px 8px;
    border: 1px solid var(--error);
    color: var(--error); font-size: 12px; overflow-wrap: anywhere;
  }
  /* Send and decline ride the bottom of the form while the questions scroll
     under them: a note field on every question and a long option list must not
     put the one control that ends the wait out of reach. The row paints its own
     background, so nothing shows through it. */
  #ask .ask-controls {
    position: sticky; bottom: 0; z-index: 1;
    display: grid; grid-template-columns: 1fr auto; gap: 6px;
    margin-top: 0; padding-top: 8px; padding-bottom: 2px;
    background: var(--panel);
  }
  #ask .ask-controls button {
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line);
    padding: 10px 12px; font-size: 11px; min-height: 44px;
    flex: 1;
    text-transform: uppercase;
    letter-spacing: .06em;
    font-weight: 400;
  }
  #ask .ask-controls button.send {
    border-color: var(--accent); color: var(--accent); font-weight: 650;
  }
  #ask .ask-controls button[disabled] { opacity: .45; }
  #ask .ask-done { margin-top: 8px; font-size: 12.5px; color: var(--done); }
  /* A question that closed before the reader answered is not a success: the
     blocked colour says a decision left without them. */
  #ask .ask-gone { margin-top: 8px; font-size: 11px; color: var(--blocked); text-transform: uppercase; letter-spacing: .06em;}
  #ask .ask.settled .ask-opt, #ask .ask.settled .ask-text { opacity: .6; }
  #ask .ask.settled .ask-opt { cursor: default; }

  /* Safari zooms the page when a field takes focus with a font size under
     16px, and the page stays scaled until a pinch brings it back. At a phone or
     small tablet width every field a thumb can focus keeps 16, so the tap never
     zooms; the rules above keep the desktop look. The width covers a phone on
     its side as well as upright. Pinch stays enabled: the zoom is the symptom,
     not the reader's setting. */
  @media (max-width: 900px) {
    #compose input, #compose select, #send textarea,
    #ask .ask-text, #ask .ask-note, .targets select { font-size: 16px; }
  }</style>
</head>
<body class="tab-panes">
  <div class="topbar">
    <header class="fleet">
      <div class="bar">
        <h1 id="session">dm</h1>
        <button id="sheet-open" class="sheet-open">actions</button>
        <button id="thumbs-toggle" class="toggle">pictures</button>
        <button id="notify-toggle" class="toggle" aria-pressed="false" data-state="off" title="turn notifications on for this device">notify</button>
      </div>
      <div class="counts" id="counts"></div>
    </header>
    <nav class="tabs" role="tablist">
      <a id="tab-panes" href="#panes" role="tab" aria-selected="true">Panes</a>
      <a id="tab-box" href="#box" role="tab" aria-selected="false">Box</a>
    </nav>
    <div id="needs"></div>
  </div>
  <div id="banner"></div>

  <div id="view-panes">
    <div id="thumbs"><div class="empty">loading</div></div>
    <div id="panes"><div class="empty">loading</div></div>
  </div>

  <div id="view-box">
    <div id="box"><div class="empty">loading</div></div>
    <form id="compose">
      <input id="compose-key" type="text" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" placeholder="key">
      <select id="compose-state">
        <option value="note">note</option>
        <option value="working">working</option>
        <option value="blocked">blocked</option>
        <option value="done">done</option>
        <option value="error">error</option>
      </select>
      <input id="compose-msg" type="text" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" placeholder="message">
      <button id="compose-post">post to the box</button>
    </form>
  </div>

  <div id="sheet">
    <div class="panel">
      <header>
        <h1>actions</h1>
        <button class="close" id="sheet-close">close</button>
      </header>
      <div id="sheet-body"><div class="empty">loading</div></div>
      <!-- The page's own row, pinned under the scrolling commands: an installed
           app has no reload button and no address bar, so this is how a new
           build reaches the phone without deleting the icon. It reads nothing
           from the daemon, so it works even when the command list does not. -->
      <div class="cmd">
        <button id="app-reload" title="fetch this page and its script again, so a new build shows">reload the page</button>
      </div>
    </div>
  </div>

  <section id="pane">
    <header>
      <h1 id="pane-title">pane</h1>
      <span class="state" id="pane-state"><b id="pane-state-word"></b><span id="pane-state-msg"></span></span>
      <button class="collapse" id="pane-collapse" aria-expanded="true" title="hide the command bar">⌃</button>
      <button class="stop" id="pane-stop" title="interrupt the turn and stop the agent">stop</button>
      <button class="close" id="pane-close">close</button>
    </header>
    <div id="views"><div class="seg" role="tablist">
      <a id="view-transcript" role="tab" aria-selected="true">transcript</a>
      <a id="view-activity" role="tab" aria-selected="false">activity</a>
      <a id="view-screen" role="tab" aria-selected="false">screen</a>
    </div></div>
    <div id="pane-actions"></div>
    <div id="pane-note"></div>
    <div id="ask"></div>
    <div id="screen" class="show-screen">
      <pre id="text" class="view"></pre>
      <div id="transcript" class="view"></div>
      <div id="activity" class="view"></div>
      <button id="latest" title="jump to the latest output">latest</button>
    </div>
    <div id="send">
      <input id="send-image" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
      <button id="send-attach" aria-label="attach a picture" title="attach a picture the agent can read">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <circle cx="8.5" cy="10" r="1.5"/>
          <path d="M21 16l-5-5-9 9"/>
        </svg>
      </button>
      <textarea id="send-text" rows="1" autocomplete="off" autocapitalize="off"
                autocorrect="off" spellcheck="false"
                placeholder="type into the pane"></textarea>
      <button id="send-submit" class="enter" aria-label="send" title="send the text and press enter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M22 2 11 13"/>
          <path d="M22 2 15 22 11 13 2 9 22 2z"/>
        </svg>
      </button>
    </div>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
